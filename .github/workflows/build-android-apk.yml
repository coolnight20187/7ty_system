name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'sms_reader_app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: sms_reader_app/package-lock.json

    - name: Install dependencies
      working-directory: sms_reader_app
      run: npm ci

    - name: Sync Capacitor
      working-directory: sms_reader_app
      run: npx cap sync android

    - name: Make gradlew executable
      working-directory: sms_reader_app/android
      run: chmod +x gradlew

    - name: Build Debug APK
      working-directory: sms_reader_app/android
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: 7ty-bank-reader-debug
        path: sms_reader_app/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Build Release APK
      working-directory: sms_reader_app/android
      run: ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: 7ty-bank-reader-release
        path: sms_reader_app/android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
