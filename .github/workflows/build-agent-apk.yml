name: Build Agent APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build-agent-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: mobile_app/package-lock.json

    - name: Install dependencies
      working-directory: mobile_app
      run: npm ci

    - name: Clean old Android assets
      working-directory: mobile_app
      run: |
        rm -rf android/app/src/main/assets/public || true
        rm -rf android/app/build || true
        echo "=== Cleaned old assets ==="

    - name: Sync Capacitor (force copy)
      working-directory: mobile_app
      run: |
        npx cap sync android --inline
        echo "=== Checking synced files ==="
        ls -la android/app/src/main/assets/public/ || true
        head -20 android/app/src/main/assets/public/index.html || true

    - name: Make gradlew executable
      working-directory: mobile_app/android
      run: chmod +x gradlew

    - name: Clean all Gradle caches
      run: |
        rm -rf ~/.gradle/caches || true
        rm -rf ~/.gradle/wrapper || true
        rm -rf ~/.gradle/daemon || true

    - name: Build Debug APK
      working-directory: mobile_app/android
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=false"
        ./gradlew clean assembleDebug --no-daemon --no-build-cache --refresh-dependencies

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: 7ty-agent-debug
        path: mobile_app/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Build Release APK
      working-directory: mobile_app/android
      run: ./gradlew assembleRelease

    - name: List APK files
      run: |
        echo "=== Debug APKs ==="
        ls -la mobile_app/android/app/build/outputs/apk/debug/ || true
        echo "=== Release APKs ==="
        ls -la mobile_app/android/app/build/outputs/apk/release/ || true

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: 7ty-agent-release
        path: mobile_app/android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: agent-v2.129.0
        name: "Đại Lý 7TY v2.129.0"
        body: |
          ## 📱 Đại Lý 7TY App v2.129.0
          
          ### 🆕 Thay đổi mới:
          - ✅ **Đổi tên app**: 7TY Agent → Đại Lý 7TY
          - 🖼️ **Logo mới**: Cập nhật logo ứng dụng
          - 🔔 **Push Notification**: Thông báo đẩy cho tất cả giao dịch và thông báo hệ thống
          - 💰 **Số Tiền Tùy Chọn**: Thêm tính năng nhập số tiền nạp tùy ý (tối thiểu 100.000đ)
          
          ### ✨ Tính năng:
          - 📱 **Đọc SMS Ngân Hàng**: Tự động nạp tiền khi nhận SMS chuyển khoản
          - 🔄 Cải thiện hiệu suất và độ ổn định
          - 🔐 APK đã được ký với chữ ký SHA256withRSA 4096-bit
          
          ### 📥 Cài đặt:
          1. Tải file APK bên dưới
          2. Nếu bị chặn bởi Play Protect: Nhấn "Cài đặt anyway"
          3. Cho phép cài đặt từ nguồn không xác định
          
          ### 📋 Yêu cầu:
          - Android 7.0 trở lên
          - Kết nối Internet
          
          **Build Date**: ${{ steps.date.outputs.date }}
        files: |
          mobile_app/android/app/build/outputs/apk/release/app-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
