<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  
  <!-- SMS Icon -->
  <rect x="40" y="50" width="112" height="80" rx="12" fill="url(#accent)" opacity="0.9"/>
  
  <!-- Message lines -->
  <rect x="55" y="70" width="60" height="8" rx="4" fill="white" opacity="0.9"/>
  <rect x="55" y="88" width="45" height="8" rx="4" fill="white" opacity="0.7"/>
  <rect x="55" y="106" width="75" height="8" rx="4" fill="white" opacity="0.5"/>
  
  <!-- Phone outline -->
  <rect x="115" y="92" width="22" height="36" rx="4" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="126" cy="122" r="2" fill="white"/>
  
  <!-- 7TY Text -->
  <text x="96" y="168" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">7TY</text>
</svg>
