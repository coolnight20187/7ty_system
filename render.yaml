# Render Blueprint - https://render.com
# Deploy: Connect GitHub repo -> Select render.yaml

services:
  # Web Service
  - type: web
    name: sevenapp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sevendb
          property: connectionString
      - key: DATABASE_TYPE
        value: postgres
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"

databases:
  - name: sevendb
    plan: free
    databaseName: appdb
    user: appadmin
