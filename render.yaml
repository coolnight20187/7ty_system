# Render Blueprint - https://render.com
# Deploy: Connect GitHub repo -> Select render.yaml

services:
  # Web Service
  - type: web
    name: 7ty-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_TYPE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: 7ty-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: 7ty-postgres
          property: port
      - key: DB_USER
        fromDatabase:
          name: 7ty-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: 7ty-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: 7ty-postgres
          property: database
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - name: 7ty-postgres
    plan: free
    databaseName: 7ty_vn_db
    user: 7ty_admin
