# Render Blueprint - https://render.com
# Deploy: Connect GitHub repo -> Select render.yaml

services:
  # Web Service
  - type: web
    name: seven
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seven-postgres
          property: connectionString
      - key: DATABASE_TYPE
        value: postgres
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - name: seven-postgres
    plan: free
    databaseName: appdb
    user: appadmin
