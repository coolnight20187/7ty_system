# Koyeb deployment configuration
# Use with: koyeb app init

version: 1.0.0
name: 7ty

services:
  - name: web
    type: web
    image:
      build:
        dockerfile: Dockerfile
    ports:
      - port: 8000
        protocol: http
    env:
      - name: DATABASE_TYPE
        value: sqlite
      - name: SQLITE_DB_PATH
        value: /app/data/7ty_vn.db
      - name: SECRET_KEY
        secret: secret-key
    health_check:
      http:
        path: /health
        port: 8000
    scaling:
      min: 1
      max: 1
    instance_type: nano
